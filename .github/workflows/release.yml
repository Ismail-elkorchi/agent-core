name: release-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / minimum Node 24.8.0
            os: ubuntu-latest
            node: 24.8.0
          - name: Ubuntu / current Node 24
            os: ubuntu-latest
            node: 24
          - name: macOS / current Node 24
            os: macos-latest
            node: 24
          - name: Windows / current Node 24
            os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '15.2.0'
          $archive = Join-Path $env:RUNNER_TEMP "ripgrep-$version.zip"
          $destination = Join-Path $env:RUNNER_TEMP 'ripgrep'
          Invoke-WebRequest "https://github.com/BurntSushi/ripgrep/releases/download/$version/ripgrep-$version-x86_64-pc-windows-msvc.zip" -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5') {
            throw "Unexpected ripgrep archive hash: $hash"
          }
          Expand-Archive $archive -DestinationPath $destination
          $binary = Get-ChildItem $destination -Recurse -Filter rg.exe | Select-Object -First 1
          if ($null -eq $binary) { throw 'The ripgrep archive did not contain rg.exe' }
          $binary.Directory.FullName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify ripgrep
        run: rg --version
      - run: npm ci
      - run: npm run verify:release
