name: release-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / minimum Node 24.8.0
            os: ubuntu-latest
            node: 24.8.0
          - name: Ubuntu / current Node 24
            os: ubuntu-latest
            node: 24
          - name: macOS / current Node 24
            os: macos-latest
            node: 24
          - name: Windows / current Node 24
            os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify:release
